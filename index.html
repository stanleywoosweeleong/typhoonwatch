<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>风眼 · 台风监测</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<meta name="theme-color" content="#0a1420">
<style>
:root{
  --bg:#0a1420; --panel:#0f1f2e; --panel2:#132738; --line:#1e3648;
  /* Contrast is compressed at BOTH ends for a dark screen read outdoors:
     nothing goes to pure white, which glares, and nothing sits at the old
     --faint, which measured 3.0:1 against the background and vanished in
     sunlight. Ratios against --bg: ink 13.6, hi 14.9, dim 8.6, faint 6.0. */
  --ink:#d5e2ed; --hi:#e2ebf4; --dim:#9fb3c6; --faint:#7f95a8;
  --soft:#a8bccd;
  --amber:#ffb020; --red:#ff5b52; --teal:#43c2ab;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:15.5px;line-height:1.62;padding:0 0 48px;
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
header{padding:18px 0 12px;border-bottom:1px solid var(--line);margin-bottom:14px}
/* Tracking belongs to the Latin half only. On the h1 it also spaced 风眼
   apart, which reads as a typo in Chinese rather than as a logotype. */
h1{margin:0;font-size:27px;font-weight:800}
h1 .lat{letter-spacing:.2em;font-size:19px;color:var(--dim);font-weight:700}
.sub{color:var(--dim);font-size:13.5px;margin-top:3px;letter-spacing:.04em}
.tools{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
button{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);
  border-radius:7px;padding:6px 11px;font-size:13px;cursor:pointer}
button:hover{border-color:var(--faint)}
/* Language button: what you are reading now, then what a tap gives you. */
.nx{color:var(--dim);font-size:12.5px;margin-left:7px}
button:disabled{cursor:default;border-style:dashed}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
select{font:inherit;font-size:13px;color:var(--ink);background:var(--panel2);
  border:1px solid var(--line);border-radius:7px;padding:6px 9px}
.fresh{border:1px solid var(--line);border-left:3px solid var(--teal);background:var(--panel);
  border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:13.5px}
.fresh.stale{border-left-color:var(--red);background:#26161a;color:#ffd7d4}
.fresh.warnish{border-left-color:var(--amber);background:#241d10}
.fresh b{font-family:var(--mono)}
/* Partial-failure list. The fetcher can succeed overall and still lose a
   storm, so what it could not get is named here rather than left blank. */
.probs{display:block;margin-top:7px;font-size:12.5px;line-height:1.55;color:#ffd489;
  font-family:var(--mono);word-break:break-word}
.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;
  padding:14px;margin-bottom:16px}
.cardhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.sname{font-size:18px;font-weight:700}
.snum{display:inline-flex;align-items:center;justify-content:center;min-width:20px;
  height:20px;padding:0 5px;margin-right:8px;border-radius:10px;background:var(--amber);
  color:var(--bg);font-family:var(--mono);font-size:12px;font-weight:700;position:relative;top:-2px}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-family:var(--mono);font-size:12px;letter-spacing:.06em;padding:3px 7px;
  border-radius:5px;background:#1d3d55;color:#bfe0f5;white-space:nowrap}
.badge.hot{background:#4a1d1a;color:#ffb4ae}
.badge.amb{background:#3a2c0d;color:#ffd489}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:9px;margin-top:12px}
.cell{background:var(--panel2);border-radius:8px;padding:8px 10px}
.cell .k{font-size:12px;color:var(--dim);letter-spacing:.05em}
.cell .v{font-family:var(--mono);font-size:16px;margin-top:1px}
.v.hot{color:var(--red);font-weight:700}
.rangeline{margin-top:12px;font-size:13.5px;background:var(--panel2);border-radius:8px;padding:9px 11px}
.rangeline .num{font-family:var(--mono);color:var(--amber)}
.rangeline .note{display:block;color:var(--dim);font-size:13px;margin-top:3px}
.plain{margin:9px 0 0;font-size:16px;line-height:1.72}
.plain:first-of-type{font-size:18.5px;font-weight:700;color:var(--hi)}
.mapwhat{font-size:13.5px;color:var(--soft);margin-top:11px;line-height:1.5}
.seasonline{font-size:13px;color:var(--dim);margin-bottom:8px}
.maptools{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:2px}
.maptime{font-size:12.5px;color:var(--faint);font-family:var(--mono)}
.plotwrap{margin-top:9px;background:#081019;border:1px solid var(--line);border-radius:9px;padding:6px}
svg.plot{display:block;width:100%;height:auto}
.caption{font-size:13px;color:var(--soft);margin-top:6px;text-align:right;line-height:1.5}
details{margin-top:11px;border-top:1px solid var(--line);padding-top:9px}
summary{cursor:pointer;font-size:13.5px;color:var(--dim);list-style:none}
summary::-webkit-details-marker{display:none}
summary:before{content:"▸ ";color:var(--faint)}
details[open]>summary:before{content:"▾ "}
summary:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:4px}
pre.tty{font-family:var(--mono);font-size:12.5px;line-height:1.45;color:#a9c6dc;
  background:#070e16;border:1px solid var(--line);border-radius:7px;
  padding:11px;overflow-x:auto;white-space:pre;margin:9px 0 0}
/* Glossary bodies carry real paragraph breaks; without this every \n
   collapsed to a space and the longer entries read as one wall. */
.gloss{white-space:pre-line}
.decode{margin:9px 0 0;padding:0;list-style:none}
.decode li{padding:8px 0;border-bottom:1px dashed var(--line)}
.decode li:last-child{border-bottom:0}
.decode code{font-family:var(--mono);font-size:13.5px;color:var(--amber);display:block}
.decode span{font-size:14px;color:var(--dim)}
.inv{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;
  padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.inv:last-of-type{border-bottom:0}
.inv .pos{font-family:var(--mono);color:var(--dim);font-size:13px;margin-top:2px}
h2{font-size:13.5px;letter-spacing:.12em;color:var(--dim);font-weight:700;
  text-transform:uppercase;margin:26px 0 10px}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:10px;
  padding:22px 16px;text-align:center;color:var(--dim);font-size:14.5px}
footer{margin-top:30px;padding-top:14px;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--faint);line-height:1.7}
.stamp{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-top:8px}
/* The footer is a details like the others, minus the rule above it — the
   footer already draws one. */
details.foot{border-top:0;padding-top:0;margin-top:0}
.qrwrap{margin-top:14px;display:flex;gap:13px;align-items:center;flex-wrap:wrap}
/* A QR must be dark on light. Scanners cope badly with inverted codes, so
   this is the one pale panel in the app, and it keeps its quiet zone. */
.qr{width:116px;height:116px;background:#e7eef5;border-radius:9px;flex:0 0 auto}
.qr svg{display:block;width:100%;height:100%}
.qrcap{font-size:12.5px;color:var(--dim);line-height:1.55;flex:1 1 160px}
.qrcap .u{display:block;margin-top:5px;font-family:var(--mono);font-size:11.5px;
  color:var(--faint);word-break:break-all}
@media (prefers-reduced-motion:no-preference){.card{animation:rise .25s ease both}}
@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
</style>
</head>

<div class="wrap">
<header>
  <h1 id="brand">风眼<span class="lat"> TYPHOONWATCH</span></h1>
  <div class="sub" id="tagline"></div>
  <div class="tools">
    <button id="langBtn" type="button">简体<span class="nx">→ 繁體</span></button>
    <button id="updBtn" type="button"></button>
    <select id="refSel" aria-label="参考地点 / reference place"></select>
  </div>
</header>
<div id="fresh" class="fresh">…</div>

<h2 id="hLearn">读懂台风情报 · HOW TO READ</h2>
<div id="learn" class="card"></div>
<footer>
  <details id="footBox" class="foot">
    <summary id="footSum"></summary>
    <div id="credit"></div>
    <div class="qrwrap">
      <div class="qr" id="qr"></div>
      <div class="qrcap" id="qrCap"></div>
    </div>
  </details>
  <div class="stamp" id="stamp"></div>
</footer>
</div>

var TWMAP={"与":"與","专":"專","东":"東","两":"兩","严":"嚴","个":"個","为":"為","么":"麼","义":"義","乱":"亂","于":"於","云":"雲","亚":"亞","产":"產","从":"從","们":"們","会":"會","体":"體","余":"餘","儿":"兒","兰":"蘭","关":"關","内":"內","写":"寫","军":"軍","冲":"沖","况":"況","准":"準","凉":"涼","几":"幾","则":"則","别":"別","办":"辦","务":"務","动":"動","劳":"勞","势":"勢","区":"區","协":"協","单":"單","厅":"廳","压":"壓","参":"參","发":"發","变":"變","号":"號","后":"後","响":"響","团":"團","围":"圍","国":"國","图":"圖","圆":"圓","场":"場","处":"處","头":"頭","实":"實","宾":"賓","对":"對","尔":"爾","层":"層","岘":"峴","岛":"島","带":"帶","干":"乾","并":"並","广":"廣","应":"應","开":"開","张":"張","强":"強","径":"徑","志":"誌","总":"總","扫":"掃","报":"報","换":"換","据":"據","数":"數","断":"斷","无":"無","时":"時","显":"顯","晋":"晉","晕":"暈","暂":"暫","机":"機","杂":"雜","权":"權","条":"條","来":"來","构":"構","标":"標","树":"樹","样":"樣","档":"檔","检":"檢","欧":"歐","气":"氣","汇":"彙","没":"沒","测":"測","涌":"湧","涡":"渦","温":"溫","湾":"灣","湿":"濕","滞":"滯","灾":"災","点":"點","热":"熱","牵":"牽","状":"狀","环":"環","现":"現","画":"畫","着":"著","码":"碼","础":"礎","确":"確","离":"離","种":"種","积":"積","稳":"穩","简":"簡","紧":"緊","红":"紅","约":"約","级":"級","纬":"緯","线":"線","组":"組","细":"細","织":"織","经":"經","给":"給","统":"統","续":"續","绳":"繩","维":"維","绿":"綠","缓":"緩","编":"編","网":"網","罗":"羅","联":"聯","节":"節","范":"範","萨":"薩","虚":"虛","补":"補","见":"見","观":"觀","规":"規","览":"覽","觉":"覺","计":"計","认":"認","讯":"訊","记":"記","讲":"講","许":"許","设":"設","证":"證","诉":"訴","词":"詞","话":"話","该":"該","详":"詳","误":"誤","说":"說","请":"請","读":"讀","谁":"誰","调":"調","谈":"談","谨":"謹","负":"負","责":"責","败":"敗","贴":"貼","费":"費","资":"資","赌":"賭","趋":"趨","车":"車","转":"轉","载":"載","较":"較","辐":"輻","输":"輸","边":"邊","达":"達","过":"過","运":"運","还":"還","这":"這","进":"進","远":"遠","连":"連","选":"選","邻":"鄰","里":"裡","钟":"鐘","钱":"錢","错":"錯","镜":"鏡","长":"長","门":"門","闭":"閉","间":"間","闷":"悶","阳":"陽","阴":"陰","阵":"陣","阶":"階","陆":"陸","随":"隨","难":"難","雾":"霧","静":"靜","页":"頁","顶":"頂","项":"項","预":"預","颜":"顏","风":"風","飘":"飄","马":"馬","鲁":"魯"};

function s2t(s){
  if(typeof s!=="string") return s;
  var i,out=s;
  for(i=0;i<TWPROT.length;i++) out=out.split(TWPROT[i][0]).join("\ue000"+String.fromCharCode(0xe001+i));

  for(i=0;i<out.length;i++){ var c=out.charAt(i); r+=(TWMAP[c]||c); }
  for(i=0;i<TWPROT.length;i++) r=r.split("\ue000"+String.fromCharCode(0xe001+i)).join(TWPROT[i][1]);
  return r;
}

/* JMA's own field names stay on the left of every decode line — the point
   of that section is that you can open the JMA page and recognise them.
   But a term you cannot read decodes nothing, so each carries a gloss.
   The gloss is dropped when the kanji already IS the word in the reader's
   script (最大風速 needs no gloss for a Chinese reader, 予報円 does), which

var JTERM={
  "最大風速":{zh:"最大风速",en:"max sustained wind"},
  "最大瞬間風速":{zh:"最大瞬间风速",en:"max gust"},

function jterm(t){

}
function fill(s,o){ return s.replace(/\{(\w+)\}/g,function(_,k){ return o[k]!==undefined?o[k]:"{"+k+"}"; }); }

/* ---- geometry ------------------------------------------------------- */
function hav(a,b,c,d){
  var R=6371, r=Math.PI/180, dLat=(c-a)*r, dLon=(d-b)*r;
  var s=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a*r)*Math.cos(c*r)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return 2*R*Math.asin(Math.min(1,Math.sqrt(s)));
}
function bearing(a,b,c,d){
  var r=Math.PI/180;
  var y=Math.sin((d-b)*r)*Math.cos(c*r);
  var x=Math.cos(a*r)*Math.sin(c*r)-Math.sin(a*r)*Math.cos(c*r)*Math.cos((d-b)*r);
  return (Math.atan2(y,x)/r+360)%360;
}
var CMP={zh:["北","东北偏北","东北","东北偏东","东","东南偏东","东南","东南偏南",
             "南","西南偏南","西南","西南偏西","西","西北偏西","西北","西北偏北"],
         en:["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"]};
function compass(deg){ return X(CMP[lang==="tw"?"zh":lang][Math.round(deg/22.5)%16]); }
function fmtLat(v){ return Math.abs(v).toFixed(1)+(v<0?"S":"N"); }
function fmtLon(v){ return Math.abs(v).toFixed(1)+(v<0?"W":"E"); }
function ago(ms){
  var h=ms/36e5;
  if(h<1) return Math.max(0,Math.round(h*60))+X(lang!=="en"?" 分钟":" min");
  if(h<48) return h.toFixed(1)+X(lang!=="en"?" 小时":" h");
  return (h/24).toFixed(1)+X(lang!=="en"?" 天":" d");
}
function shortT(iso){
  var d=new Date(iso);
  if(isNaN(d)) return "—";
  return d.toISOString().slice(5,16).replace("T"," ")+"Z";
}
/* Malaysia keeps UTC+8 year round — no daylight saving — so a fixed offset
   is exact, not an approximation. */
function myt(iso){
  var d=new Date(iso);
  if(isNaN(d)) return "—";
  return new Date(d.getTime()+8*36e5).toISOString().slice(5,16).replace("T"," ");
}
function bothT(iso){ return myt(iso)+" "+L("myt")+" ("+shortT(iso)+")"; }
/* JMA quotes 10-minute sustained wind. Saffir-Simpson is defined on
   1-minute wind, so any category shown here is a conversion, and it is
   labelled as one rather than presented as JMA's own number. */
function saffirFrom10min(kt10){
  if(kt10==null) return null;
  var kt1 = kt10/0.88;
  if(kt1>=137) return "Cat 5"; if(kt1>=113) return "Cat 4";
  if(kt1>=96) return "Cat 3";  if(kt1>=83) return "Cat 2";
  if(kt1>=64) return "Cat 1";  return null;
}

/* ---- DOM helpers ---------------------------------------------------- */
/* THE render boundary. Almost every string in this app reaches the page
   through here, so this is where Simplified becomes Traditional — not at
   each of the sixty-odd call sites, which is how the conversion came to be
   missed nearly everywhere. X() is a no-op unless lang is "tw", and s2t()
   is idempotent (no Traditional character is a key in TWMAP), so the few
   places that already call X() themselves stay correct. */
function el(tag,cls,txt){
  var n=document.createElement(tag);
  if(cls) n.className=cls;
  if(txt!==undefined) n.textContent=X(txt);
  return n;
}
function cell(k,v,cls){
  var c=el("div","cell"); c.appendChild(el("div","k",k));
  var d=el("div","v"+(cls?" "+cls:"")); d.textContent=X(v); c.appendChild(d);
  return c;
}
var DOC=null, OFFLINE=false, LOADERR=null;

try{ SHOWISO = localStorage.getItem("twatch.iso")!=="0"; }catch(e){}

/* ---- freshness ------------------------------------------------------ */
function renderFresh(){
  var box=document.getElementById("fresh");
  box.className="fresh"; box.textContent="";
  if(!DOC){
    box.classList.add("stale");
    box.appendChild(el("div",null,L("freshNoData")));
    if(LOADERR){
      box.appendChild(el("div","pos",L("loadFail")+" "+LOADERR));
      var a=document.createElement("a");
      a.href=DATA_URL; a.target="_blank"; a.rel="noopener";
      a.textContent=X(L("openData")); a.style.color="#ffd7d4";
      box.appendChild(a);
    }
    return;
  }
  if(DOC.demo){ box.classList.add("warnish"); box.textContent=X(L("demo")); return; }

  var newest=null;
  (DOC.storms||[]).forEach(function(s){
    var t=Date.parse(s.issued||"");
    if(!isNaN(t) && (newest===null||t>newest)) newest=t;
  });
  var now=Date.now(), html;
  if(DOC.fetch_ok===false){
    box.classList.add("stale");
    html=fill(L("freshFail"),{when:DOC.last_attempt||"?"});
  } else if(newest!==null && (now-newest)/36e5>STALE_H){
    box.classList.add("stale");
    html=fill(L("freshStale"),{t:bothT(new Date(newest).toISOString()),age:ago(now-newest),h:STALE_H});
  } else if(newest!==null){
    html=fill(L("freshOk"),{t:"<b>"+bothT(new Date(newest).toISOString())+"</b>",
      age:ago(now-newest),fetch:DOC.generated?bothT(DOC.generated):"?"});
    var due=nextDue();
    if(due) html+=" · "+fill(L("nextDue"),{t:due+" "+L("myt")});
  } else {
    html=fill(L("freshOk"),{t:"—",age:"—",fetch:(DOC.generated||"?")});
  }
  if(OFFLINE) html+=" "+L("offline");
  box.innerHTML=X(html);   // built as a string, so it misses el()'s boundary

  /* A run can succeed overall and still lose one storm, one GDACS call or the
     pressure grid — fetch_ok stays true and `generated` advances, so nothing
     else on the page would show it. Silence there is exactly the failure this
     app refuses: name what did not arrive, in the fetcher's own words. */
  var probs=(DOC.errors||[]).filter(function(e){ return e; });
  if(probs.length){
    if(!box.classList.contains("stale")) box.classList.add("warnish");
    box.appendChild(el("span","probs",L("partial")+" "+probs.join(" · ")));
  }
}

/* ---- coastline ------------------------------------------------------ */
function coastPaths(minLo,maxLo,minLa,maxLa,PX,PY,width,colour){
  var out="";
  for(var i=0;i<COAST.length;i++){
    var line=COAST[i], d="", drawing=false, any=false;
    for(var j=0;j<line.length;j++){
      var lo=line[j][0], la=line[j][1];
      var inside = lo>=minLo-2 && lo<=maxLo+2 && la>=minLa-2 && la<=maxLa+2;
      if(inside){
        d += (drawing?"L":"M")+PX(lo).toFixed(1)+" "+PY(la).toFixed(1)+" ";
        drawing=true; any=true;
      } else { drawing=false; }
    }
    if(any) out+='<path d="'+d.trim()+'" fill="none" stroke="'+colour+
                 '" stroke-width="'+width+'" stroke-linejoin="round" stroke-linecap="round"/>';
  }
  return out;
}

/* ---- isobars --------------------------------------------------------
   Marching squares over the MSLP grid the fetcher mirrored. This draws the
   published ECMWF field and nothing else: no lows are named, no circulation
   is classified. A closed contour off Borneo is for you to read, not for the
   app to label. Tropical pressure gradients are slack, so the interval is
   1 hPa rather than the 4 hPa of a mid-latitude chart. */
function isobarPaths(P,PX,PY){
  if(!P||!P.grid||!P.grid.values) return "";
  var g=P.grid, v=g.values, nx=g.nx, ny=g.ny, out="", lvl, i, j;
  function at(ix,iy){ var t=v[iy*nx+ix]; return (t===null||t===undefined)?NaN:t; }
  function lon(ix){ return g.w+ix*g.step; }
  function lat(iy){ return g.s+iy*g.step; }
  var lo=Infinity, hi=-Infinity;
  for(i=0;i<v.length;i++){ var t=v[i]; if(t!==null&&t!==undefined){ if(t<lo)lo=t; if(t>hi)hi=t; } }
  if(!isFinite(lo)||hi-lo<0.5) return "";
  var segs=[];
  for(lvl=Math.ceil(lo); lvl<=Math.floor(hi); lvl+=1){
    for(j=0;j<ny-1;j++) for(i=0;i<nx-1;i++){
      var a=at(i,j+1), b=at(i+1,j+1), c=at(i+1,j), d=at(i,j);  // TL TR BR BL
      if(isNaN(a)||isNaN(b)||isNaN(c)||isNaN(d)) continue;
      var idx=(a>lvl?8:0)|(b>lvl?4:0)|(c>lvl?2:0)|(d>lvl?1:0);
      if(idx===0||idx===15) continue;
      var x0=PX(lon(i)), x1=PX(lon(i+1)), y0=PY(lat(j+1)), y1=PY(lat(j));
      function ip(p,q){ return (lvl-p)/(q-p); }
      var T=[x0+(x1-x0)*ip(a,b), y0],      // top edge
          R=[x1, y0+(y1-y0)*ip(b,c)],      // right edge
          B=[x0+(x1-x0)*ip(d,c), y1],      // bottom edge
          Lf=[x0, y0+(y1-y0)*ip(a,d)];     // left edge
      var E={1:[Lf,B],2:[B,R],3:[Lf,R],4:[T,R],5:[Lf,T,B,R],6:[T,B],7:[Lf,T],
             8:[Lf,T],9:[T,B],10:[Lf,B,T,R],11:[T,R],12:[Lf,R],13:[B,R],14:[Lf,B]}[idx];
      for(var k=0;k+1<E.length;k+=2) segs.push([E[k],E[k+1],lvl]);
    }
  }
  if(!segs.length) return "";
  var d2="";
  segs.forEach(function(s){
    d2+="M"+s[0][0].toFixed(1)+" "+s[0][1].toFixed(1)+"L"+s[1][0].toFixed(1)+" "+s[1][1].toFixed(1)+" ";
  });
  // Violet, deliberately unlike the blue-grey coastline: on a dark map two
  // line families in the same hue read as one drawing.
  var K=mapScale();
  /* As fine as the screen will draw. Every step up in weight costs detail:
     adjacent contours fuse and the shape of the field, which is the whole
     point of the layer, goes with them. 0.7px is the thinnest that still
     survives a phone's pixel grid. */
  out+='<path d="'+d2.trim()+'" fill="none" stroke="#a78bd0" stroke-width="'+
       (0.7*K).toFixed(2)+'" opacity="0.92"/>';

  /* One value label per level, so a bullseye reads as 1004 rather than being
     guessed at. It used to go on that level's rightmost segment, full stop —
     and where several levels crowd the same corner, four labels landed on top
     of each other and the result was unreadable digits ("1005006"). Now each
     level walks its own segments from the right until it finds a spot nobody
     has taken, and if there is no such spot the label is DROPPED. A missing
     number is honest; overlapping numbers are a wrong number. */
  var FSI=+(10*K).toFixed(1), placed=[], cand={};
  segs.forEach(function(s){ (cand[s[2]]=cand[s[2]]||[]).push([s[0][0],s[0][1]]); });
  function freeAt(x,y,w){
    if(x<2||y<FSI) return false;
    for(var i=0;i<placed.length;i++){
      var b=placed[i];
      if(x<b.x+b.w+FSI*0.4 && b.x<x+w+FSI*0.4 && y-FSI<b.y+FSI*0.3 && b.y-FSI<y+FSI*0.3) return false;
    }
    return true;
  }
  Object.keys(cand).sort(function(a,b){ return b-a; }).forEach(function(k){
    var list=cand[k].slice().sort(function(a,b){ return b[0]-a[0]; });
    var w=String(k).length*0.62*FSI, step=Math.max(1,Math.floor(list.length/60));
    for(var i=0;i<list.length;i+=step){
      var x=list[i][0]+3*K, y=list[i][1]-3*K;
      if(!freeAt(x,y,w)) continue;
      placed.push({x:x,y:y,w:w});
      out+='<text x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" fill="#bda6e0" font-size="'+FSI+
           '" font-family="monospace" paint-order="stroke" stroke="#081019" stroke-width="'+
           (2.6*K).toFixed(1)+'">'+k+'</text>';
      return;
    }
  });
  return out;
}

/* ---- regional overview ---------------------------------------------- */
/* The plots are drawn in a 680-unit viewBox stretched to the column width,
   so on a phone every label renders at about HALF the size it asks for — an
   11-unit label lands at 5.6px on a 390px screen. Everything in the plots is
   therefore sized in rendered pixels and multiplied by this factor, and the
   label-collision arithmetic uses the same number, so the drawn size and the
   measured size can never drift apart. */
function mapScale(){
  var vw=(typeof window!=="undefined"&&window.innerWidth)||760;
  var col=Math.min(760,vw)-28-14;          // .wrap padding, then .plotwrap
  if(!(col>80)) col=680;
  return Math.max(0.85,Math.min(2.4,680/col));
}

/* Back to the original ink (#2b4f63) and the original weight. The land is
   the frame, not the subject — it says WHERE, the isobars say WHAT. The only
   thing kept from the brightening experiment is the scaling: the original
   0.8 units rendered as 0.41px on a phone and disappeared, so the width is
   now given in RENDERED pixels and comes out the same on every screen. */
function coastW(K,base){ return +(base*K).toFixed(2); }

/* Latitude ticks: south of the equator is S, not a negative N. */
function latTick(g){ return (g<0?(-g)+"S":g+"N"); }

/* The equator is the whole reason Malaysia is not typhoon country, so it
   belongs on every frame that contains it, not only the region map. It
   also labels itself, which is why the graticule skips its "0N" tick. */
function equatorSVG(W,PY,minLa,maxLa,K){
  if(minLa>0||maxLa<0) return "";
  var y=PY(0).toFixed(1), fs=(10.5*K).toFixed(1);
  return '<line x1="0" y1="'+y+'" x2="'+W+'" y2="'+y+
         '" stroke="#476e39" stroke-width="'+K.toFixed(2)+'" stroke-dasharray="'+
         (7*K).toFixed(1)+' '+(6*K).toFixed(1)+'"/>'+
         '<text x="'+(6*K).toFixed(1)+'" y="'+(PY(0)-5*K).toFixed(1)+
         '" fill="#7aa862" font-size="'+fs+'">'+X(lang!=="en"?"赤道":"Equator")+'</text>';
}

function overviewMap(storms,others,ref){
  var W=680, H=Math.round(W*(REGION.n-REGION.s)/(REGION.e-REGION.w));
  var K=mapScale();                         // rendered px -> user units
  var FSG=+(10*K).toFixed(1),               // graticule ticks
      FSL=+(12.5*K).toFixed(1),             // storm and place names
      FSO=+(10.5*K).toFixed(1),             // GDACS names
      FSN=+(10*K).toFixed(1),               // the number inside a dot
      RD=+(7.5*K).toFixed(1);               // storm dot radius
  function PX(lo){ return (lo-REGION.w)/(REGION.e-REGION.w)*W; }
  function PY(la){ return H-(la-REGION.s)/(REGION.n-REGION.s)*H; }
  var g,svg='<svg class="plot" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="region">';
  for(g=100;g<=REGION.e;g+=10)
    svg+='<line x1="'+PX(g).toFixed(1)+'" y1="0" x2="'+PX(g).toFixed(1)+'" y2="'+H+'" stroke="#132030"/>';
  for(g=-10;g<=REGION.n;g+=10){
    svg+='<line x1="0" y1="'+PY(g).toFixed(1)+'" x2="'+W+'" y2="'+PY(g).toFixed(1)+'" stroke="#132030"/>';
    // 0 gets no "0N": the equator is drawn separately below and labels itself.
    if(g!==0)
      svg+='<text x="'+(3*K).toFixed(1)+'" y="'+(PY(g)-3*K).toFixed(1)+
           '" fill="#5c7891" font-size="'+FSG+'" font-family="monospace" paint-order="stroke"'+
           ' stroke="#081019" stroke-width="'+(2.4*K).toFixed(1)+'">'+latTick(g)+'</text>';
  }
  if(SHOWISO) svg+=isobarPaths((DOC&&DOC.pressure)||null,PX,PY);
  svg+=coastPaths(REGION.w,REGION.e,REGION.s,REGION.n,PX,PY,coastW(K,0.85),"#2b4f63");

  svg+=equatorSVG(W,PY,REGION.s,REGION.n,K);

  /* Colour on this map already says WHAT a thing is — amber = JMA storm,
     hollow ring = GDACS, white = your place — so it cannot also say WHICH
     storm this is without the caption becoming untrue. Identity rides on
     the two channels still free: the number inside the dot, which is the
     number on its card below, and one dash pattern per storm, so two
     tracks that cross can still be told apart. */
  var TRACKDASH=["5 4","2 5","10 4","1 4","8 3 2 3"];
  var LBOX=[];                       // boxes already occupied on the canvas
  for(g=-10;g<=REGION.n;g+=10)       // graticule labels down the left edge
    if(g!==0) LBOX.push({x:3*K,y:PY(g)-3*K,w:2.4*FSG});
  LBOX.push({x:6*K,y:PY(0)-5*K,w:2.6*FSG});   // and the equator caption
  function labelW(t){
    var w=0,i;
    for(i=0;i<t.length;i++) w+=FSL*(t.charCodeAt(i)>0x2e80?1:0.56);   // CJK is wide
    return w;
  }
  /* A label box is x..x+w wide, one font-size above the baseline and a
     quarter of one below it — measured from FSL so it follows the scale. */
  /* `skip` is the label's OWN dot. A name is supposed to sit right beside
     the dot it belongs to — counting that as a collision pushed every name a
     row further down than it needed to be, which is what made them drift
     toward each other. */
  function boxHits(a,skip){
    var top=a.y-FSL, bot=a.y+FSL*0.27, i, b;
    if(a.x<2||a.x+a.w>W-2||top<0||bot>H) return true;
    for(i=0;i<LBOX.length;i++){
      b=LBOX[i];
      if(b===skip) continue;
      var pad=FSL*0.35;
      if(a.x<b.x+b.w+pad && b.x<a.x+a.w+pad && top<b.y+FSL*0.27+pad && b.y-FSL-pad<bot) return true;
    }
    return false;
  }
  /* BELOW the dot, always, if there is any room: the track leaves the storm
     towards the north-west, so anything placed above or left of the dot sits
     on the line the reader is trying to follow. Below-right first, then
     below-left, then straight below; only when the frame edge forbids all
     three does the name go above. */
  function placeLabel(px,py,txt,skip){
    var w=labelW(txt), o=RD+3*K, d=RD+0.95*FSL, i, c,
        /* Below-right, then straight below, then below-left. Centring under
           the dot comes BEFORE going left, because a wide name near the right
           edge used to fail below-right on the frame and swing across to the
           left, where it ended up sitting beside somebody else's storm. The
           name belongs to a dot; it should stay under that dot. */
        cand=[[px+o,py+d],[px-w/2,py+d],[px-o-w,py+d],
              [px-w/2,py+d+1.25*FSL],
              [px+o,py-d*0.6],[px-w/2,py-d*0.6],[px-o-w,py-d*0.6]];
    for(i=0;i<cand.length;i++){
      c={x:cand[i][0],y:cand[i][1],w:w};
      if(!boxHits(c,skip)) return c;
    }
    for(i=1;i<=6;i++){                 // last resort: step it down the page
      c={x:cand[0][0],y:cand[0][1]+1.25*FSL*i,w:w};
      if(!boxHits(c,skip)) return c;
    }
    return {x:cand[0][0],y:cand[0][1],w:w};   // overlap rather than drop a name
  }

  var rx=+PX(ref.lon).toFixed(1), ry=+PY(ref.lat).toFixed(1);
  var refTxt=X(lang==="en"?ref.en:ref.zh).replace(/[<>&]/g,"");
  LBOX.push({x:rx-5,y:ry+4,w:10});                 // your place: the dot
  LBOX.push({x:rx+7,y:ry+4,w:labelW(refTxt)});     // your place: its name

  /* Pass 1 registers every dot before pass 2 places any label, so a label
     can never land on a storm that simply had not been drawn yet. */
  var plot=[];
  (storms||[]).forEach(function(s,i){
    var c=s.current;
    if(!c||c.lat==null) return;      // no position: no dot. The card still lists it.
    var px=+PX(c.lon).toFixed(1), py=+PY(c.lat).toFixed(1);
    var own={x:px-RD,y:py+FSL*0.27,w:2*RD};
    plot.push({s:s,n:i+1,px:px,py:py,c:c,own:own});
    LBOX.push(own);
    // and every forecast position, so no name lands across the track
    (s.forecast||[]).forEach(function(f){
      if(f.lat==null) return;
      var fx=PX(f.lon), fy=PY(f.lat);
      if(fx<-20||fx>W+20) return;
      LBOX.push({x:fx-3*K,y:fy+FSL*0.27,w:6*K});
    });
  });
  plot.forEach(function(p){
    var pts=[[p.c.lon,p.c.lat]];
    (p.s.forecast||[]).forEach(function(f){ if(f.lat!=null) pts.push([f.lon,f.lat]); });
    if(pts.length>1)
      svg+='<path d="'+pts.map(function(q,i){return (i?"L":"M")+PX(q[0]).toFixed(1)+" "+PY(q[1]).toFixed(1);}).join(" ")+
           '" fill="none" stroke="#43c2ab" stroke-width="'+(1.6*K).toFixed(2)+
           '" stroke-dasharray="'+TRACKDASH[(p.n-1)%TRACKDASH.length]
             .split(" ").map(function(d){return (d*K).toFixed(1);}).join(" ")+'"/>';
    svg+='<circle cx="'+p.px+'" cy="'+p.py+'" r="'+RD+'" fill="#ffb020"/>'+
         '<text x="'+p.px+'" y="'+p.py+'" dy=".33em" text-anchor="middle" fill="#0a1420"'+
         ' font-size="'+FSN+'" font-weight="700" font-family="monospace">'+p.n+'</text>';
    var t=X(stormLabel(p.s)).replace(/[<>&]/g,"");
    var pos=placeLabel(p.px,p.py,t,p.own);
    LBOX.push(pos);
    svg+='<text x="'+pos.x.toFixed(1)+'" y="'+pos.y.toFixed(1)+
         '" fill="#ffd489" font-size="'+FSL+'" font-weight="700" paint-order="stroke"'+
         ' stroke="#081019" stroke-width="'+(3.2*K).toFixed(1)+'">'+t+'</text>';
  });
  (others||[]).forEach(function(o){
    if(o.also_jma||o.lat==null) return;
    if(o.lon<REGION.w||o.lon>REGION.e||o.lat<REGION.s||o.lat>REGION.n) return;
    var col=o.alert==="red"?"#ff5b52":o.alert==="orange"?"#ff9a3c":"#7fb2c9";
    var ox=+PX(o.lon).toFixed(1), oy=+PY(o.lat).toFixed(1);
    var ot=String(o.name||"").replace(/[<>&]/g,"");
    var op=placeLabel(ox,oy,ot); LBOX.push(op);
    svg+='<circle cx="'+ox+'" cy="'+oy+'" r="'+(5*K).toFixed(1)+'" fill="none" stroke="'+col+
         '" stroke-width="'+(2*K).toFixed(2)+'"/>'+
         '<text x="'+op.x.toFixed(1)+'" y="'+op.y.toFixed(1)+
         '" fill="'+col+'" font-size="'+FSO+'" paint-order="stroke" stroke="#081019"'+
         ' stroke-width="'+(3*K).toFixed(1)+'">'+ot+'</text>';
  });
  svg+='<circle cx="'+rx+'" cy="'+ry+'" r="'+(4*K).toFixed(1)+'" fill="#e2ebf4" stroke="#0a1420"'+
       ' stroke-width="'+K.toFixed(2)+'"/>'+
       '<text x="'+(rx+6*K).toFixed(1)+'" y="'+(ry+4*K).toFixed(1)+
       '" fill="#e2ebf4" font-size="'+FSL+'" font-weight="700" paint-order="stroke"'+
       ' stroke="#081019" stroke-width="'+(3.2*K).toFixed(1)+'">'+refTxt+'</text>';
  return svg+'</svg>';
}

/* ---- track plot with forecast circles -------------------------------- */
function trackPlot(s,ref){
  var cur=s.current, pts=[];
  if(cur) pts.push({lat:cur.lat,lon:cur.lon,tau:0,circle:0});
  (s.forecast||[]).forEach(function(f){
    if(f.lat!=null) pts.push({lat:f.lat,lon:f.lon,tau:f.tau,circle:f.circle_km||0});
  });
  if(!pts.length) return "";
  var minLa=1e9,maxLa=-1e9,minLo=1e9,maxLo=-1e9;
  pts.concat([{lat:ref.lat,lon:ref.lon}]).forEach(function(p){
    var padDeg=(p.circle||0)/111;
    minLa=Math.min(minLa,p.lat-padDeg);maxLa=Math.max(maxLa,p.lat+padDeg);
    minLo=Math.min(minLo,p.lon-padDeg);maxLo=Math.max(maxLo,p.lon+padDeg);
  });
  /* Malaysia's relationship with typhoons is entirely a latitude story —
     too near the equator for one to spin up, close enough for the surge to
     arrive. So when the chosen place sits near the equator, hold the
     equator inside the frame rather than cropping it out by a degree or
     two. Regional places further north (Manila, Taipei, Tokyo) are left
     alone: dragging the frame down to 0 for them would shrink the storm
     to nothing for no gain. */
  if(Math.abs(ref.lat)<8){ minLa=Math.min(minLa,0); maxLa=Math.max(maxLa,0); }
  var padLa=Math.max(1.5,(maxLa-minLa)*.12), padLo=Math.max(1.5,(maxLo-minLo)*.12);
  minLa-=padLa;maxLa+=padLa;minLo-=padLo;maxLo+=padLo;
  var W=680,H=380;
  var sc=Math.max((maxLo-minLo)/W,(maxLa-minLa)/H);
  var cLo=(minLo+maxLo)/2, cLa=(minLa+maxLa)/2;
  minLo=cLo-sc*W/2; maxLo=cLo+sc*W/2; minLa=cLa-sc*H/2; maxLa=cLa+sc*H/2;
  function PX(lo){ return (lo-minLo)/(maxLo-minLo)*W; }
  function PY(la){ return H-(la-minLa)/(maxLa-minLa)*H; }
  var kmPerPx=(maxLa-minLa)*111/H;

  var K=mapScale();
  var FSG=+(10*K).toFixed(1), FST=+(11*K).toFixed(1), FSL=+(13*K).toFixed(1);
  /* "115E" is about four monospace characters wide; a tick every 5 degrees
     collides with its neighbour as soon as the frame is wide or the screen is
     narrow. Step up until the gap clears the label with room to breathe. */
  function tickStep(span, px, chars){
    var need=chars*0.62*FSG+FSG, steps=[1,2,5,10,15,20,30];
    for(var i=0;i<steps.length;i++) if(px/(span/steps[i])>need) return steps[i];
    return 30;
  }
  var g,svg='<svg class="plot" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="track">';
  svg+=coastPaths(minLo,maxLo,minLa,maxLa,PX,PY,coastW(K,1.0),"#2b4f63");
  var stepLo=tickStep(maxLo-minLo,W,5), stepLa=tickStep(maxLa-minLa,H,4);
  for(g=Math.ceil(minLo/stepLo)*stepLo; g<=maxLo; g+=stepLo)
    svg+='<line x1="'+PX(g).toFixed(1)+'" y1="0" x2="'+PX(g).toFixed(1)+'" y2="'+H+'" stroke="#16293a"/>'+
         '<text x="'+(PX(g)+3*K).toFixed(1)+'" y="'+(H-4*K).toFixed(1)+
          '" fill="#5c7891" font-size="'+FSG+'" font-family="monospace" paint-order="stroke"'+
          ' stroke="#081019" stroke-width="'+(2.4*K).toFixed(1)+'">'+g+'E</text>';
  for(g=Math.ceil(minLa/stepLa)*stepLa; g<=maxLa; g+=stepLa){
    svg+='<line x1="0" y1="'+PY(g).toFixed(1)+'" x2="'+W+'" y2="'+PY(g).toFixed(1)+'" stroke="#16293a"/>';
    if(g!==0)   // the equator carries its own label, drawn next
      svg+='<text x="'+(4*K).toFixed(1)+'" y="'+(PY(g)-4*K).toFixed(1)+
           '" fill="#5c7891" font-size="'+FSG+'" font-family="monospace" paint-order="stroke"'+
           ' stroke="#081019" stroke-width="'+(2.4*K).toFixed(1)+'">'+latTick(g)+'</text>';
  }
  svg+=equatorSVG(W,PY,minLa,maxLa,K);

  if(pts.length>1){
    svg+='<path d="'+pts.map(function(p,i){return (i?"L":"M")+PX(p.lon).toFixed(1)+" "+PY(p.lat).toFixed(1);}).join(" ")+
         '" fill="none" stroke="#43c2ab" stroke-width="'+(2*K).toFixed(2)+
         '" stroke-dasharray="'+(6*K).toFixed(1)+' '+(5*K).toFixed(1)+'"/>';
  }
  /* Seeded with the dots themselves. An hour printed across its own storm
     dot — which is what "+48h" over the orange analysis dot was — hides the
     one mark on the map that is not a forecast. */
  var TAUBOX=[];
  pts.forEach(function(p,i){
    var r=(i?4:7)*K;
    TAUBOX.push({x:PX(p.lon)-r,y:PY(p.lat)+r*0.3,w:2*r});
  });
  // Forecast circles first, so the track and dots sit on top of them.
  pts.forEach(function(p){
    if(!p.circle) return;
    svg+='<circle cx="'+PX(p.lon).toFixed(1)+'" cy="'+PY(p.lat).toFixed(1)+'" r="'+(p.circle/kmPerPx).toFixed(1)+
         '" fill="rgba(67,194,171,0.10)" stroke="#43ae99" stroke-width="'+(1.35*K).toFixed(2)+
         '" stroke-dasharray="'+(3.5*K).toFixed(1)+' '+(3.5*K).toFixed(1)+'"/>';
  });
  pts.forEach(function(p,i){
    svg+='<circle cx="'+PX(p.lon).toFixed(1)+'" cy="'+PY(p.lat).toFixed(1)+'" r="'+
         ((i?4:7)*K).toFixed(1)+'" fill="'+(i?"#43c2ab":"#ffb020")+'"/>';
    if(i){
      /* Every forecast point keeps its hour. Dropping the ones that collided
         left a storm with seven dots and three numbers, which reads as if the
         app lost track of four of them. Instead the labels ALTERNATE above
         and below the line — the track runs roughly along one axis, so the
         two rows interleave — and only if both sides and a nudged fallback
         are all taken does one give way. */
      var lt="+"+p.tau+"h", lw=lt.length*0.62*FST, lx0=PX(p.lon), ly0=PY(p.lat);
      var up=(i%2===1), tries=[];
      function push(dx,dy){ tries.push([lx0+dx,ly0+dy]); }
      push(-lw/2, up?-7*K:7*K+FST*0.8);          // centred above / below
      push(-lw/2, up?7*K+FST*0.8:-7*K);          // the other side
      push(7*K,   up?-7*K:7*K+FST*0.8);          // shifted right, same side
      push(-lw-7*K, up?-7*K:7*K+FST*0.8);        // shifted left
      push(-lw/2, up?-7*K-1.3*FST:7*K+2.1*FST);  // one row further out
      var spot=null;
      for(var t=0;t<tries.length && !spot;t++){
        var cx=tries[t][0], cy=tries[t][1], clear=true;
        if(cx<2||cx+lw>W-2||cy-FST<0||cy>H-2) continue;
        for(var q=0;q<TAUBOX.length;q++){
          var bb=TAUBOX[q];
          if(cx<bb.x+bb.w+FST*0.25 && bb.x<cx+lw+FST*0.25 &&
             cy-FST<bb.y+FST*0.25 && bb.y-FST<cy+FST*0.25){ clear=false; break; }
        }
        if(clear) spot=[cx,cy];
      }
      if(spot){
        TAUBOX.push({x:spot[0],y:spot[1],w:lw});
        svg+='<text x="'+spot[0].toFixed(1)+'" y="'+spot[1].toFixed(1)+
             '" fill="#9fb3c6" font-size="'+FST+'" font-family="monospace" paint-order="stroke"'+
             ' stroke="#081019" stroke-width="'+(2.8*K).toFixed(1)+'">'+lt+'</text>';
      }
    }
  });
  var rx=+PX(ref.lon).toFixed(1), ry=+PY(ref.lat).toFixed(1);
  svg+='<circle cx="'+rx+'" cy="'+ry+'" r="'+(4*K).toFixed(1)+'" fill="#e2ebf4" stroke="#081019"'+
       ' stroke-width="'+K.toFixed(2)+'"/>'+
       '<text x="'+(rx+6*K).toFixed(1)+'" y="'+(ry+4*K).toFixed(1)+
       '" fill="#e2ebf4" font-size="'+FST+'" paint-order="stroke" stroke="#081019"'+
       ' stroke-width="'+(3*K).toFixed(1)+'">'+
       X(lang==="en"?ref.en:ref.zh).replace(/[<>&]/g,"")+'</text>';
  // Name sits with the storm. Western Pacific tracks run up and to the LEFT
  // (northwest), so the forecast dots and their +NNh labels crowd that side.
  // Default the name below and to the right — the water the storm has already
  // crossed — and only move it when the frame edge forces the issue.
  if(s._label && pts.length){
    var lbl=X(String(s._label)).replace(/[<>&]/g,"");
    var wpx=0;
    for(var wi=0;wi<lbl.length;wi++) wpx+=FSL*(lbl.charCodeAt(wi)>0x2e80?1:0.58);
    wpx+=6*K;
    var ax=PX(pts[0].lon), ay=PY(pts[0].lat);
    var lx=ax+13*K, anchor="start";
    if(lx+wpx > W-6*K){ lx=ax-13*K; anchor="end"; }   // flip to the left instead
    if(anchor==="start" && lx<6*K) lx=6*K;
    if(anchor==="end" && lx-wpx<6*K){ lx=ax+13*K; anchor="start"; }
    var ly=ay+1.75*FSL;                               // below by default
    if(ly > H-8*K) ly=ay-1.2*FSL;                     // unless it would fall off
    // and step it down past any forecast hour already sitting there
    for(var bump=0;bump<3;bump++){
      var lx0=(anchor==="end"?lx-wpx:lx), hit=false;
      for(var tb=0;tb<TAUBOX.length;tb++){
        var t2=TAUBOX[tb];
        if(lx0<t2.x+t2.w && t2.x<lx0+wpx && ly-FSL<t2.y+FSL*0.3 && t2.y-FSL<ly){ hit=true; break; }
      }
      if(!hit) break;
      ly += 1.3*FSL;
      if(ly>H-6*K){ ly=ay-1.2*FSL; break; }
    }
    svg+='<text x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'" fill="#ffd489" font-size="'+FSL+'"'+
         ' font-weight="700" text-anchor="'+anchor+'" paint-order="stroke"'+
         ' stroke="#081019" stroke-width="'+(3.5*K).toFixed(1)+'">'+lbl+'</text>';
  }
  return svg+'</svg>';
}

/* ---- decode --------------------------------------------------------- */
function decodeList(s){
  var c=s.current||{}, ul=el("ul","decode"), items=[];
  if(s.issued) items.push([bothT(s.issued), lang!=="en"
    ? "发表时刻（世界时）。气象厅以日本时间发表，本页统一换算成世界时；马来西亚时间＝世界时 +8 小时，日本时间 −1 小时。"
    : "Issue time in UTC. JMA publishes in JST; Malaysia is UTC+8, one hour behind Japan."]);
  if(c.wind_ms!=null) items.push([jterm("最大風速")+" · "+c.wind_ms+" m/s ("+c.wind_kt+" kt)", lang!=="en"
    ? "10 分钟平均风速——和大马气象局同一个标准，可以直接比较。美国 JTWC 用 1 分钟平均，同一个台风会高出约 14%。"
    : "A 10-minute average — the same standard MET Malaysia uses, so the numbers are directly comparable. JTWC's 1-minute average runs about 14% higher for the same storm."]);
  if(c.gust_ms!=null) items.push([jterm("最大瞬間風速")+" · "+c.gust_ms+" m/s", lang!=="en"
    ? "瞬间最大值，通常是持续风的 1.3–1.5 倍。吹倒树、掀屋顶的是它，不是平均风。"
    : "The instantaneous peak, typically 1.3–1.5× the sustained wind. This is what takes down trees and roofs."]);
  if(c.pressure_hpa!=null) items.push([c.pressure_hpa+" hPa", lang!=="en"
    ? "中心气压。数字越低越强——这是气象厅判断强度的主要依据，和风速是一体两面。"
    : "Central pressure. Lower is stronger — JMA's primary intensity measure, the other side of the same coin as wind speed."]);
  if(c.course_jp){
    var cg=jp(c.course_jp), cbits=[c.course_jp+(cg&&cg!==c.course_jp?" = "+cg:"")];
    if(c.move_kt!=null) cbits.push(c.move_kt+" kt");
    if(c.speed_note_jp) cbits.push(c.speed_note_jp+" = "+jp(c.speed_note_jp));
    items.push([cbits.join(" · "), lang!=="en"
    ? "进行方向是「去向」"+(c.move_deg!=null?"（"+c.move_deg+"°，即朝"+compass(c.move_deg)+"）":"")+"。风向则相反，用「来向」——最容易搞混的地方。速度很慢时气象厅不给数字，只写「ゆっくり」（缓慢）或「ほとんど停滞」（几乎停滞）。"
    : "Course is where it is going"+(c.move_deg!=null?" ("+c.move_deg+"°, toward "+compass(c.move_deg)+")":"")+". Wind direction uses the opposite convention. When movement is slow JMA gives no number, only ゆっくり (slow) or ほとんど停滞 (nearly stationary)."]);
  }
  if(c.accuracy_jp) items.push([jterm("位置")+" · "+c.accuracy_jp+" = "+jp(c.accuracy_jp), lang!=="en"
    ? "定位精度：正確（准确）／ほぼ正確（大致准确）／不確実（不确定）。连现在的位置都分等级，预报位置的不确定只会更大。"
    : "Position accuracy: 正確 exact / ほぼ正確 nearly exact / 不確実 uncertain. Even the present position is graded — forecast positions are looser still."]);
  if((c.storm_radii||[]).length) items.push([jterm("暴風域")+" · "+c.storm_radii.map(function(r){return jp(r.area_jp)+" "+r.km+" km";}).join(" / "), lang!=="en"
    ? "暴风域＝风速 25 m/s 以上的范围，按方位分开列，因为台风从来不是圆的。強風域则是 15 m/s 以上。"
    : "The storm area is where winds reach 25 m/s or more, listed per sector because storms are never circular. The gale area (強風域) is the 15 m/s threshold."]);
  if((c.gale_radii||[]).length) items.push([jterm("強風域")+" · "+c.gale_radii.map(function(r){return jp(r.area_jp)+" "+r.km+" km";}).join(" / "), lang!=="en"
    ? "强风域＝风速 15 m/s 以上的范围，比暴风域大得多，也是先到的那一圈。同样按方位分开列。"
    : "The gale area is where winds reach 15 m/s or more. It is much larger than the storm area and it arrives first. Listed per sector, for the same reason."]);
  var f0=(s.forecast||[])[0];
  if(f0&&f0.circle_km) items.push([jterm("予報円")+" · "+f0.circle_km+" km @ +"+f0.tau+"h", lang!=="en"
    ? "预报圆：台风中心有 7 成机会落在圈内。圈越大代表路径越难预测，和台风强弱无关。注意圈会随时间变大——这就是不确定度增长的样子。"
    : "The forecast circle: a 70% chance the centre falls inside it. A bigger circle means a less predictable track, and says nothing about intensity. Watch it grow with lead time — that is uncertainty made visible."]);
  items.forEach(function(p){
    var li=el("li"); li.appendChild(el("code",null,p[0])); li.appendChild(el("span",null,p[1])); ul.appendChild(li);
  });
  return ul;
}

/* Display name. JMA names storms only once they reach tropical-storm grade;
   below that they carry a lowercase letter (a, b, c...) instead of a number,
   so "b" is JMA's own designation, not a placeholder. */
function stormLabel(s){
  var n=String(s.typhoon_number||"");
  if(s.name_en && /^\d+$/.test(n))
    return (lang!=="en"?"台风 "+n.slice(-2)+" 号 ":"Typhoon "+n.slice(-2)+" ")+s.name_en;
  if(s.name_en) return s.name_en;
  return L("tdLetter")+(n?" "+n:"");
}

/* ---- plain language -------------------------------------------------
   Simple mode. Same two numbers as the outlook table, said in the way a
   farmer would say them, with the REASON kept in — "north is rising and we
   are not" teaches something that survives the next event, where a bare
   verdict does not. Still not a forecast, and it says so.               */
function plainLines(ref,P,nchg){
  var e=P.places[ref.id];
  if(!e) return null;
  var chg=e.change24;
  var surge=(nchg===null||chg===null||chg===undefined)?null:+(nchg-chg).toFixed(1);
  var g=regime(chg,surge), out=[], W=lang!=="en";
  if(!g) return null;

  if(g.k==="wet"){
    out.push(W?"接下来偏湿。":"Leaning wetter.");
    if(chg<=-0.7)
      out.push(W?("我们这里的气压 24 小时里降了 "+Math.abs(chg).toFixed(1)+" 百帕。气压降，通常代表水气正在往这边聚。")
                :("Pressure here has fallen "+Math.abs(chg).toFixed(1)+" hPa in 24 hours. Falling pressure usually means moisture is gathering."));
    if(surge!==null&&surge>=1.5)
      out.push(W?("北方（香港、海口、三亚一带）的气压在升，我们这里没跟着升，两边差距拉开了 "+surge.toFixed(1)+" 百帕。差距越大，季风吹得越急，雨越容易一连下几天。")
                :("Pressure to the north (Hong Kong, Haikou, Sanya) is rising while ours is not — the gap has widened by "+surge.toFixed(1)+" hPa. The wider that gap, the harder the monsoon blows, and the more likely rain runs for days."));
  } else if(g.k==="dry"){
    out.push(W?"接下来偏干，但会闷、会热。":"Leaning drier — but stifling and hot.");
    out.push(W?("我们这里的气压 24 小时里升了 "+Math.abs(chg).toFixed(1)+" 百帕。台风像抽风机，把空气抽上去，抽走的空气总要沉回来，常常就沉在我们头顶。空气一沉，云就长不高，午后雷雨打不上来——所以会闷热、会积霾，但不太下雨。")
              :("Pressure here has risen "+Math.abs(chg).toFixed(1)+" hPa in 24 hours. A typhoon pumps air upward, and that air has to sink back down somewhere — often over us. Sinking air stops clouds growing tall, so the afternoon storms never fire: hot, sticky, hazy, but little rain."));
  } else {
    out.push(W?"暂时平稳，看不出明显方向。":"Steady for now, no clear direction.");
    out.push(W?("气压 24 小时几乎没动（"+(chg>0?"+":"")+chg.toFixed(1)+" 百帕）。天可能灰灰的，中层云飘过来，但不一定下得成雨。这种时候最难讲，也不值得为它改动安排——等下一次更新再看。")
              :("Pressure has barely moved in 24 hours ("+(chg>0?"+":"")+chg.toFixed(1)+" hPa). It may look grey as mid-level cloud drifts over, without the rain following. This is the hardest state to call, and not one to change your plans for — wait for the next update."));
  }

  var ph=monsoon(DOC&&DOC.generated);
  if(g.k==="wet"&&ph!=="inter")
    out.push(W?(ph==="ne"?"现在是东北季风季，雨通常先落在吉兰丹、丁加奴和彭亨东岸。"
                        :"现在是西南季风季，雨通常偏向西海岸和砂拉越。")
              :(ph==="ne"?"It is northeast monsoon season, so the rain usually lands first on Kelantan, Terengganu and east Pahang."
                        :"It is southwest monsoon season, so the rain tends to favour the west coast and Sarawak."));

  // The lead card names only the nearest storm, but must say how many exist,
  // so a second system in the basin is never invisible to someone who reads
  // the top of the page and stops there.
  var near=null, count=0;
  ((DOC&&DOC.storms)||[]).forEach(function(s){
    var c=s.current; if(!c||c.lat==null) return;
    count++;
    var d=hav(c.lat,c.lon,ref.lat,ref.lon);
    if(!near||d<near.d) near={d:d,s:s};
  });
  if(near){
    var many = count>1;
    out.push(W?((many?("目前区域内有 "+count+" 个系统，最近的是"):"目前最近的台风是")+
                stormLabel(near.s)+"，在 "+Math.round(near.d).toLocaleString()+" 公里外。"+
                (many?"其余的在下面的台风情报里都有。":"")+
                "台风本身几乎不会打到马来西亚，影响我们的是它把季风变强。")
              :((many?("There are "+count+" systems in the region; the nearest is "):"The nearest typhoon is ")+
                stormLabel(near.s)+", "+Math.round(near.d).toLocaleString()+" km away. "+
                (many?"The rest are listed below. ":"")+
                "Typhoons themselves almost never reach Malaysia; what reaches us is the monsoon they strengthen."));
  }
  return {lines:out,g:g,chg:chg,surge:surge};
}

function renderSimple(){
  var box=document.getElementById("simple"); box.textContent="";
  var ref=refPlace(), P=(DOC&&DOC.pressure)||null;
  if(!P||!P.places){
    box.appendChild(el("div",null,DOC&&DOC.generated?L("presNone"):L("unknown")));
    return;
  }
  var r=plainLines(ref,P,northChange(P));
  if(!r){ box.appendChild(el("div",null,L("presNone"))); return; }
  var head=el("div","cardhead");
  head.appendChild(el("div","sname",(lang==="en"?ref.en:ref.zh)));
  head.appendChild(el("span","badge"+(r.g.k==="wet"?" amb":r.g.k==="dry"?" hot":""),
    L("reg")[r.g.k]+(r.g.strong?L("regStrong"):"")));
  box.appendChild(head);
  r.lines.forEach(function(t){ box.appendChild(el("p","plain",t)); });
  box.appendChild(el("div","pos",L("hpa")+" "+P.places[ref.id].hpa.toFixed(1)+
    " · 24h "+(r.chg<0?"▼":"▲")+Math.abs(r.chg).toFixed(1)+
    (r.surge!==null?" · "+L("surgeShort")+" "+(r.surge>0?"+":"")+r.surge.toFixed(1):"")));
  var n=el("div","rangeline"); n.appendChild(el("span","note",L("simpleNote")));
  box.appendChild(n);
}

/* ---- outlook ---------------------------------------------------------
   The most interpretive thing in this app, so it shows its own arithmetic.
   Two published numbers per place, nothing else:
     chg   = MSLP change over 24 h at that place
     surge = how much faster the northern South China Sea is rising than
             that place is  (mean northern chg - local chg)
   A positive surge means the north-south gradient is tightening, which is
   what accelerates the monsoon wind. Thresholds are stated in the panel so
   a reader can disagree with them. This is a reading of a pressure trend,
   NOT a forecast, and MET Malaysia remains the authority. */
var NORTH = ["hongkong","haikou","sanya"];   // upstream end of the gradient

function northChange(P){
  var n=0, sum=0;
  NORTH.forEach(function(id){
    var e=P.places[id];
    if(e && e.change24!==null && e.change24!==undefined){ sum+=e.change24; n++; }
  });
  // round here so the surge arithmetic downstream stays clean
  return n?+(sum/n).toFixed(1):null;
}

function regime(chg, surge){
  if(chg===null||chg===undefined) return null;
  var tightening = surge!==null && surge!==undefined && surge>=1.5;
  if(chg<=-0.7 || tightening)
    return {k:"wet", strong:(chg<=-1.5)||(surge!==null&&surge>=2.5)};
  if(chg>=0.7 && !(surge!==null&&surge>=0.5))
    return {k:"dry", strong:chg>=1.5};
  return {k:"steady", strong:false};
}

/* Malaysia's monsoon calendar, as MET Malaysia defines it. Which coast a
   surge lands on depends on this, so the panel says which season it is. */
function monsoon(iso){
  var m=new Date(iso||Date.now()).getUTCMonth()+1;
  if(m>=11||m<=3) return "ne";
  if(m>=5&&m<=9) return "sw";
  return "inter";
}

function renderTrend(){
  var box=document.getElementById("trend"); box.textContent="";
  var P=(DOC&&DOC.pressure)||null;
  if(!P||!P.places||!Object.keys(P.places).length){
    box.appendChild(el("div",null,DOC&&DOC.generated?L("presNone"):L("unknown")));
    return;
  }
  var nchg=northChange(P);
  var ph=monsoon(DOC&&DOC.generated);
  box.appendChild(el("div","seasonline",L("season")[ph]));

  function rows(grp,into){
    REFS.forEach(function(r){
      if(r.grp!==grp) return;
      var e=P.places[r.id]; if(!e) return;
      var surge=(nchg===null||e.change24===null||e.change24===undefined)?null:+(nchg-e.change24).toFixed(1);
      var g=regime(e.change24,surge);
      var row=el("div","inv"), left=el("div");
      left.appendChild(el("div",null,(lang==="en"?r.en:r.zh)));
      var bits=[e.hpa.toFixed(1)+" "+L("hpa")];
      if(e.change24!==null&&e.change24!==undefined)
        bits.push("24h "+(e.change24<0?"▼":"▲")+Math.abs(e.change24).toFixed(1));
      if(surge!==null) bits.push(L("surgeShort")+" "+(surge>0?"+":"")+surge.toFixed(1));
      left.appendChild(el("div","pos",bits.join(" · ")));
      row.appendChild(left);
      if(g){
        var cls=g.k==="wet"?" amb":g.k==="dry"?" hot":"";
        row.appendChild(el("span","badge"+cls,
          L("reg")[g.k]+(g.strong?L("regStrong"):"")));
      }
      into.appendChild(row);
    });
  }
  rows("my",box);

  var dr=el("details"); dr.appendChild(el("summary",null,L("trendRegion")));
  var rbox=el("div"); rows("reg",rbox); dr.appendChild(rbox); box.appendChild(dr);

  var why=el("details"); why.appendChild(el("summary",null,L("whyTitle")));
  var ul=el("ul","decode");
  L("why").forEach(function(pair){
    var li=el("li"); li.appendChild(el("code",null,pair[0]));
    li.appendChild(el("span",null,pair[1])); ul.appendChild(li);
  });
  why.appendChild(ul); box.appendChild(why);

  var note=el("div","rangeline");
  note.appendChild(el("span","note",L("trendNote"))); box.appendChild(note);
}

/* ---- storm card ------------------------------------------------------ */
function stormCard(s,n){
  var ref=refPlace(), c=s.current||{}, card=el("div","card");
  var head=el("div","cardhead");
  // The badge carries the same number as the dot on the region map above.
  var nm=el("div","sname");
  if(n) nm.appendChild(el("span","snum",String(n)));
  nm.appendChild(document.createTextNode(X(stormLabel(s))));
  head.appendChild(nm);
  var bs=el("div","badges");
  var catCode=c.category||s.category;
  if(catCode){
    var strong = catCode==="TY";
    bs.appendChild(el("span","badge"+(strong?" hot":" amb"), (L("cat")[catCode]||catCode)));
  }
  if(c.intensity) bs.appendChild(el("span","badge hot", L("intens")[c.intensity]));
  if(c.scale) bs.appendChild(el("span","badge amb", L("scale")[c.scale]));
  var sf=saffirFrom10min(c.wind_kt);
  if(sf) bs.appendChild(el("span","badge", fill(L("saffir"),{c:sf})));
  head.appendChild(bs);
  card.appendChild(head);

  if(!s.parsed){
    var w=el("div","rangeline");
    w.appendChild(el("span",null,L("problems")+" "+(s.problems||[]).join("; ")));
    card.appendChild(w);
  }

  var g=el("div","grid");
  if(c.lat!=null) g.appendChild(cell(L("pos"), fmtLat(c.lat)+"  "+fmtLon(c.lon)));
  if(c.wind_ms!=null) g.appendChild(cell(L("wind"), c.wind_ms+" "+L("ms")+" / "+c.wind_kt+" "+L("kt"),
    c.wind_ms>=33?"hot":""));
  if(c.gust_ms!=null) g.appendChild(cell(L("gust"), c.gust_ms+" "+L("ms")+
    (c.gust_kt!=null?" / "+c.gust_kt+" "+L("kt"):"")));
  if(c.pressure_hpa!=null) g.appendChild(cell(L("press"), c.pressure_hpa+" "+L("hpa")));
  if(c.move_deg!=null||c.speed_note_jp) g.appendChild(cell(L("move"),
    (c.move_deg!=null?compass(c.move_deg):"—")+" "+
    (c.move_kmh!=null ? c.move_kmh+" "+L("kmh")+(c.move_kt!=null?" ("+c.move_kt+" "+L("kt")+")":"")
     : c.move_kt!=null ? c.move_kt+" "+L("kt")
     : jp(c.speed_note_jp))));
  if(s.typhoon_number) g.appendChild(cell(
    /^\d+$/.test(String(s.typhoon_number))?L("tnum"):L("desig"), String(s.typhoon_number)));
  if((c.storm_radii||[]).length) g.appendChild(cell(L("stormR"),
    Math.max.apply(null,c.storm_radii.map(function(r){return r.km;}))+" "+L("km")));
  if((c.gale_radii||[]).length) g.appendChild(cell(L("galeR"),
    Math.max.apply(null,c.gale_radii.map(function(r){return r.km;}))+" "+L("km")));
  card.appendChild(g);

  if(c.lat!=null){
    var d0=hav(c.lat,c.lon,ref.lat,ref.lon), line=el("div","rangeline");
    var p1=document.createElement("div");
    p1.innerHTML=X(fill(L("rangeNow"),{km:Math.round(d0).toLocaleString(),
      place:(lang==="en"?ref.en:ref.zh), dir:compass(bearing(ref.lat,ref.lon,c.lat,c.lon))}));
    line.appendChild(p1);
    var best=null;
    (s.forecast||[]).forEach(function(f){
      if(f.lat==null) return;
      var d=hav(f.lat,f.lon,ref.lat,ref.lon);
      if(!best||d<best.d) best={d:d,tau:f.tau};
    });
    if(best&&best.d<d0-25){
      var p2=document.createElement("div");
      p2.innerHTML=X(fill(L("rangeMin"),{km:Math.round(best.d).toLocaleString(),tau:best.tau}));
      line.appendChild(p2);
    }
    line.appendChild(el("span","note",L(ref.grp==="my"?"rangeNote":"rangeNoteGen")));
    card.appendChild(line);

    s._label=stormLabel(s);
    var plot=trackPlot(s,ref);
    if(plot){
      card.appendChild(el("div","mapwhat",L("mapWhatTrack")));
      var pw=el("div","plotwrap"); pw.innerHTML=plot; card.appendChild(pw);
      card.appendChild(el("div","caption",L("plotCap")));
    }
  }

  var dd=el("details"); dd.appendChild(el("summary",null,L("decodeTitle")));
  dd.appendChild(decodeList(s)); card.appendChild(dd);
  if(s.raw){
    var dr=el("details"); dr.appendChild(el("summary",null,L("rawTitle")));
    dr.appendChild(el("pre","tty",JSON.stringify(s.raw,null,1))); card.appendChild(dr);
  }
  return card;
}

function renderRegion(){
  var box=document.getElementById("region"); box.textContent="";
  var ref=refPlace();

  var bar=el("div","maptools");
  var ib=document.createElement("button");
  ib.type="button"; ib.id="isoBtn"; ib.textContent=X(L("iso"));
  ib.setAttribute("aria-pressed",SHOWISO?"true":"false");
  ib.addEventListener("click",function(){
    SHOWISO=!SHOWISO;
    try{ localStorage.setItem("twatch.iso",SHOWISO?"1":"0"); }catch(e){}
    renderAll();
  });
  bar.appendChild(ib);
  var P0=(DOC&&DOC.pressure)||null;
  if(SHOWISO && P0 && P0.grid && P0.grid.time)
    bar.appendChild(el("span","maptime",L("isoAt")+" "+myt(P0.grid.time)+" "+L("myt")));
  box.appendChild(bar);

  box.appendChild(el("div","mapwhat",L("mapWhatRegion")));
  var pw=el("div","plotwrap");
  pw.innerHTML=overviewMap((DOC&&DOC.storms)||[],(DOC&&DOC.others)||[],ref);
  box.appendChild(pw);
  box.appendChild(el("div","caption",L("regionCap")));

  var P=(DOC&&DOC.pressure)||null;
  var strip=el("div","rangeline");
  if(!P||!P.places||!Object.keys(P.places).length){
    strip.appendChild(el("div",null,L("presNone")));
  } else {
    var here=P.places[ref.id];
    if(here){
      var line=document.createElement("div");
      var txt=fill(L("presAt"),{place:(lang==="en"?ref.en:ref.zh),hpa:here.hpa.toFixed(1)});
      if(here.change24===null||here.change24===undefined){
        txt+=" · "+L("presSteady");
      } else if(Math.abs(here.change24)<0.5){
        txt+=" · "+L("presSteady");
      } else {
        txt+=" · "+fill(L("presChg"),{arrow:here.change24<0?"▼ ":"▲ ",
          chg:Math.abs(here.change24).toFixed(1)});
      }
      line.innerHTML=X(txt);
      strip.appendChild(line);
    }
    // Falling pressure elsewhere is the lead indicator, so surface the top three.
    var falls=Object.keys(P.places).map(function(id){
      var r=null;
      for(var i=0;i<REFS.length;i++) if(REFS[i].id===id) r=REFS[i];
      return r?{r:r,c:P.places[id].change24}:null;
    }).filter(function(x){ return x&&x.c!==null&&x.c!==undefined&&x.c<=-1; })
      .sort(function(a,b){ return a.c-b.c; }).slice(0,3);
    if(falls.length){
      strip.appendChild(el("div","pos",L("presFalls")+falls.map(function(f){
        return (lang==="en"?f.r.en:f.r.zh)+" ▼"+Math.abs(f.c).toFixed(1);
      }).join(" · ")));
    }
    if(P.stale) strip.appendChild(el("div","pos",L("offline")));
  }
  strip.appendChild(el("span","note",L("presNote")));
  box.appendChild(strip);
  box.appendChild(el("div","rangeline")).appendChild(el("span","note",L("regionNote")));
}

function renderOthers(){
  var box=document.getElementById("others"); box.textContent="";
  var list=(DOC&&DOC.others)||[], ref=refPlace();
  if(!list.length){
    /* An empty list means one of three different things and they must not
       look alike: never fetched, GDACS answered with nothing, or GDACS did
       not answer at all. The third used to render as the second — the page
       stated there were no events at a moment when it had no idea. */
    var gdown=(DOC&&DOC.errors||[]).some(function(e){ return /^GDACS/i.test(String(e)); });
    box.appendChild(el("div",null, !(DOC&&DOC.generated) ? L("unknown")
                                 : gdown ? L("otherFail") : L("noOther")));
    if(gdown) box.style.borderColor="#5a4a2b";
    return;
  }
  list.map(function(o){
    o._d = (o.lat!=null)?hav(o.lat,o.lon,ref.lat,ref.lon):Infinity; return o;
  }).sort(function(a,b){ return a._d-b._d; }).forEach(function(o){
    var row=el("div","inv"), left=el("div");
    var title=(o.name||o.id)+(o.also_jma?"  "+fill(L("dupOf"),{id:o.also_jma}):"");
    left.appendChild(el("div",null,title));
    var bits=[fmtLat(o.lat)+" "+fmtLon(o.lon),
              fill(L("away"),{km:Math.round(o._d).toLocaleString(),
                              place:(lang==="en"?ref.en:ref.zh)})];
    if(o.severity!=null) bits.push(o.severity+" "+(o.severity_unit||""));
    left.appendChild(el("div","pos",bits.join(" · ")));
    row.appendChild(left);
    if(o.alert) row.appendChild(el("span","badge"+(o.alert==="red"?" hot":o.alert==="orange"?" amb":""),
                                   L("alert")[o.alert]||o.alert));
    box.appendChild(row);
  });
  box.appendChild(el("div","rangeline")).appendChild(el("span","note",L("otherNote")));
}

function renderStorms(){
  var box=document.getElementById("storms"); box.textContent="";
  var list=(DOC&&DOC.storms)||[];
  if(!list.length){
    // A quiet period and a never-successful fetch look identical in the data.
    var ever=!!(DOC&&DOC.generated);
    var e=el("div","empty",L(ever?"noStorm":"unknown"));
    if(!ever) e.style.borderColor="#5a2b2b";
    box.appendChild(e); return;
  }
  list.forEach(function(s,i){ box.appendChild(stormCard(s,i+1)); });
}

 ["为什么改用日本气象厅","美国 JTWC 的服务器对数据中心 IP 一律返回 403，GitHub 的服务器抓不到。而气象厅本来就是世界气象组织指定负责西北太平洋台风的区域专责气象中心（RSMC 东京），是这个海域的官方权威；JTWC 是美军自用而对外公开的服务。换源之后反而更贴近大马气象局的口径。"],
 ["10 分钟 vs 1 分钟风速","气象厅取 10 分钟平均，大马气象局也是；美国 JTWC 取 1 分钟平均，同一个台风数值约高 14%。看到两家数字打架，先确认平均时长，再谈谁准。本页的「换算约 Cat X」是把 10 分钟风速折算成 1 分钟后对照萨菲尔-辛普森等级，是换算值，不是气象厅的原始分级。"],
 ["阶级：TD / TS / STS / TY","按 10 分钟最大风速：17 m/s 以下热带低压 TD，17–24.5 热带风暴 TS，24.5–32.7 强热带风暴 STS，32.7 以上台风 TY。「台风」这个词在气象厅的定义里，等于 33 m/s（约 64 节）这条线。"],
 ["强さ 与 大きさ","气象厅另外用两个词：強い／非常に強い／猛烈な 讲的是强度（风速），大型／超大型 讲的是范围（强风域半径）。一个台风可以「猛烈但不大」，也可以「超大型但不强」——这两件事要分开看。"],
 ["予報円（预报圆）","台风中心有 7 成机会落在圈内。圈越大＝路径越难预测，与强弱无关。圈随时间变大，就是不确定度增长的样子。注意：暴风不会乖乖待在圈里，圈讲的是「中心」的位置，不是影响范围。"],
 ["暴風域 与 強風域","暴風域＝25 m/s 以上，強風域＝15 m/s 以上。按方位分开列，因为台风从来不是圆的。看范围要看这两个，不要看预报圆。"],
 ["中心气压","气象厅判断强度的主要依据。920 hPa 比 970 hPa 强得多。气压和风速是一体两面，但气压是直接测得的，风速多半是推算的。"],
 ["热带低压的字母编号（a、b、c）","气象厅只有在气旋达到热带风暴级（10 分钟风速 17 m/s）时才给号码和名字。还没到这一级的热带低压，用小写字母排序：a、b、c……所以「热带低压 b」里的 b 是气象厅的正式编号，不是缺资料。\n这跟美国的 INVEST（90W–99W）不是同一件事：INVEST 只是「值得盯的一团云」，连中心闭合环流都不一定有；气象厅的热带低压已经是判定成立的系统，会正式发报。换句话说，INVEST 是观察名单，热带低压是已经点名的。"],
 ["GDACS 是什么","GDACS（全球灾害预警与协调系统）是欧盟联合研究中心（JRC）与联合国人道事务协调厅（OCHA）从 2004 年起合办的平台，服务对象是救灾单位。它本身不是气象机构，也不做预报：它把别人的观测和路径接进来，再按人口与基础设施估算会影响到多少人，算出绿／橙／红。\n那个颜色是影响分数，不是强度分级——猛烈台风在大洋中央可以是绿色，弱系统压在人口稠密的海岸可以是橙色，路径稍微一改，两天内从红跳回绿也不稀奇。它的气旋路径主要取自美国 JTWC 与 NOAA，分级用萨菲尔-辛普森（1 分钟风速），所以同一个台风看起来会比气象厅（10 分钟风速）高约一级。\n本页用它补一个洞：气象厅只为它正式发报的气旋编号，南海那些没到台风级的低压不会出现在上面那一节，GDACS 有时候会有。所以看它是看「那里有没有一个系统」，颜色留给救灾单位去用。"],
 ["对照天上的云","这一页给的是气压走向。天上的云是另一半，而且不用花钱就能核对——出门抬头看一眼，就知道这三档写得准不准。\n转干：台风把空气抽上去，抽走的总要沉回来，常常就沉在我们头顶。中层被压住，云长不高。天上多的是从台风那边飘过来的卷云、卷层云，薄薄一层像牛奶，太阳有时带一圈晕；底下的积云是扁的，午后堆一堆也长不上去，傍晚就散掉。霾积着不散。闷热、灰白、不下雨。\n转湿（涌流拉开）：云是一层一层压过来的，不是一朵朵长上去。灰色低云从海上某一个方向推进来，云底只有几百米，来了就不走；雨是连续的中雨，不是雷雨那种一阵一阵；风也是持续地吹，不是先狂后静。看方向和持久度：从海上来、天黑了还不散，那就是涌流。\n平稳：就是平常的日循环。清早晴或有雾，上午积云开始长，下午某几朵长得起来变雷雨，落点很碰运气——这条山谷下 20 毫米，隔壁一滴都没有。\n最容易看错的一件事：台风的卷云罩常常伸出一千公里以上。东北方向飘来高云，并不代表东西要来了——那是它的出流，而且底下往往正在下沉，反而偏干。「天色乳白＝要变天」这个直觉，在这里多半是反的。\n值得记的一条：平稳的日子，留意积云是扁的还是长得起来。这一档本页的证据最少，而天空免费告诉你答案。"],
 ["马来西亚为什么要看台风","半岛几乎不会被台风正面登陆——纬度太低，科氏力太弱，气旋转不起来。真正的影响是间接的：西北太平洋或南海的台风会拉紧气压梯度、加强东北季风涌流，把连续大雨推到吉兰丹、丁加奴、彭亨东岸。看台风，其实是提前几天看季风涌。"]
],
en:[
 ["Why JMA instead of JTWC","JTWC's servers return 403 to every datacenter IP, so GitHub's runners cannot reach them. JMA is the WMO-designated Regional Specialized Meteorological Centre for the western North Pacific (RSMC Tokyo) — the official authority for this basin. JTWC is a US military service that happens to be public. The switch actually brings us closer to MET Malaysia's own conventions."],
 ["10-minute vs 1-minute winds","JMA averages over 10 minutes, and so does MET Malaysia. JTWC averages over 1 minute, which reads about 14% higher for the same storm. When two agencies disagree, check the averaging period before deciding who is wrong. The \"≈ Cat X\" badge here converts the 10-minute wind to a 1-minute basis before comparing to Saffir-Simpson — it is a conversion, not JMA's own classification."],
 ["TD / TS / STS / TY","By 10-minute maximum wind: below 17 m/s tropical depression, 17–24.5 tropical storm, 24.5–32.7 severe tropical storm, above 32.7 typhoon. In JMA's definition the word \"typhoon\" is exactly that 33 m/s (about 64 kt) line."],
 ["Intensity vs size","JMA uses two separate scales: 強い / 非常に強い / 猛烈な describe intensity (wind speed), while 大型 / 超大型 describe size (the radius of the gale area). A storm can be violent but small, or very large but weak. Read them separately."],
 ["The forecast circle (予報円)","A 70% chance the centre falls inside. Bigger means a less predictable track, and says nothing about strength. It grows with lead time — that is uncertainty made visible. Note it describes where the centre goes, not how far the damage reaches."],
 ["Storm area vs gale area","The storm area is 25 m/s and above; the gale area is 15 m/s and above. Both are listed per sector, because storms are never circular. For extent, read these — not the forecast circle."],
 ["Central pressure","JMA's primary intensity measure. 920 hPa is far stronger than 970 hPa. Pressure and wind are two sides of one coin, but pressure is measured more directly while wind is usually estimated."],
 ["Lettered depressions (a, b, c)","JMA assigns a number and a name only once a system reaches tropical-storm grade (17 m/s, 10-minute). Depressions below that are lettered in sequence instead: a, b, c. So the b in \"Tropical depression b\" is JMA's own official designation, not missing data.\nThis is not the same as a US INVEST (90W-99W). An INVEST is merely an area worth watching and may not even have a closed circulation; a JMA tropical depression is an assessed system that gets formal bulletins. INVEST is the watchlist; a lettered depression is already named."],
 ["What GDACS is","GDACS — the Global Disaster Alert and Coordination System — is a platform run jointly by the European Commission's Joint Research Centre and the UN Office for the Coordination of Humanitarian Affairs, going since 2004. Its audience is relief agencies. It is not a weather service and it issues no forecasts: it ingests other people's observations and tracks, then estimates how many people and how much infrastructure lie in the way, and scores that as green, orange or red.\nThat colour is an impact score, not a strength grade — a violent typhoon in the middle of the ocean can be green, a weak system sitting on a crowded coast can be orange, and a small shift in the predicted track can take an alert from red back to green inside two days. Its cyclone tracks come mainly from the US JTWC and NOAA, and it grades on Saffir-Simpson using 1-minute winds, so the same storm reads about a category higher than JMA's 10-minute basis.\nThis page uses it to fill one gap: JMA numbers only the cyclones it formally bulletins, so a South China Sea low below typhoon grade never appears in the section above, and GDACS sometimes has it. Read it for whether something is there. The colour is for the relief agencies."],
 ["Checking it against the sky","This page gives you a pressure trend. The clouds are the other half, and they cost nothing — step outside, look up, and you can judge whether the three readings are any good.\nDrier: the typhoon pulls air upward and what goes up has to come down, often over us. That descent warms and dries the middle levels and puts a lid on convection. So the sky fills with cirrus and cirrostratus streaming over from the storm — a thin milky layer, sometimes a halo around the sun — while the cumulus underneath stay flat-bottomed and stunted, building a little after noon, never getting tall, gone by evening. Haze settles in because nothing washes it out. Hot, grey-white, no rain.\nWetter (the surge gap opening): cloud arrives in layers rather than growing in towers. A grey low deck pushes in from one direction off the sea, bases only a few hundred metres up, and it stays. The rain is continuous and moderate, not the burst-and-stop of a thunderstorm, and the wind blows steadily instead of gusting then dropping. Read the direction and the persistence: in off the sea, still there after dark, that is a surge.\nSteady: the ordinary daily cycle. Clear or misty at dawn, cumulus building through the morning, a few towers reaching thunderstorm size in the afternoon, and where they land is luck — 20 mm in this valley, nothing in the next.\nThe easiest thing to get backwards: a typhoon's cirrus shield routinely reaches a thousand kilometres or more beyond the centre. High cloud drifting in from the northeast is not evidence that something is coming. It is the storm's outflow, and there is often subsidence underneath it, which means drier rather than wetter. The instinct that a milky sky means a change on the way is usually inverted here.\nWorth logging: on steady days, note whether the cumulus stayed flat or went tall. That is the reading this page has the least evidence for, and the sky answers it for free."],
 ["Why Malaysia watches typhoons","The peninsula is almost never struck directly — too near the equator for Coriolis to spin one up. The real effect is indirect: a typhoon in the West Pacific or South China Sea tightens the pressure gradient and strengthens the northeast monsoon surge that pushes days of rain onto Kelantan, Terengganu and east Pahang. Watching typhoons is watching the surge a few days early."]
]};

  document.getElementById("hTrend").textContent=X(L("hTrend"));
  // The explanation sits first, in front of the reader, then the working
  // below it. No modes: one page, top to bottom.
  renderFresh(); renderSimple(); renderRegion(); renderTrend(); renderStorms(); renderOthers(); renderLearn();
  renderFoot(); renderStamp();
}

/* The browser never calls a weather API — it fetches this repo's own
   data/typhoon.json. Open-Meteo and JMA are called by the GitHub Actions
   runner a few times a day. Even so, there is no point re-fetching inside
   the 3-hourly publish cycle, so Refresh short-circuits while the data we
   hold is younger than that, and says when the next one is due. */
var CYCLE_MIN=150;                 // 2.5 h — early enough to catch a late run
function dataAge(){
  var t=DOC&&DOC.generated?Date.parse(DOC.generated):NaN;
  return isNaN(t)?Infinity:(Date.now()-t)/6e4;
}
function nextDue(){          // "08-02 15:45"
  if(!DOC||!DOC.generated) return null;
  var t=Date.parse(DOC.generated);
  if(isNaN(t)) return null;
  return myt(new Date(t+3*36e5).toISOString());
}
function nextDueClock(){     // just "15:45", for the button
  var s=nextDue();
  return s?s.slice(6):null;
}
/* The control states what it knows even when you never touch it, and only
   invites a tap when a tap would actually do something. */
function refreshStatus(){
  var b=document.getElementById("updBtn"), stale=dataAge()>=CYCLE_MIN;
  var due=nextDueClock();
  if(stale||!due){
    b.textContent=X(L("reload"));
    b.disabled=false;
    b.removeAttribute("aria-disabled");
    b.style.opacity="";
  } else {
    b.textContent=X(fill(L("nextAt"),{t:due}));
    b.disabled=true;
    b.setAttribute("aria-disabled","true");
    b.style.opacity=".65";
  }
}
function load(force){
  if(!force && dataAge()<CYCLE_MIN){ renderAll(); return; }
  var url=/[?&]demo=1/.test(location.search)?"./data/typhoon.sample.json":DATA_URL;
  LOADERR=null;
  fetch(url+"?t="+Date.now(),{cache:"no-store"})
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(function(j){ DOC=j; OFFLINE=false; LOADERR=null; renderAll(); })
    .catch(function(e1){
      // Keep the real reason. "No data yet" alone cannot tell a 404 from a
      // parse error from an offline phone, and that cost a debugging cycle.
      fetch(url).then(function(r){
          if(!r.ok) throw new Error("HTTP "+r.status);
          return r.json();
        })
        .then(function(j){ DOC=j; OFFLINE=true; LOADERR=null; renderAll(); })
        .catch(function(e2){
          DOC=null;
          LOADERR=url+" — "+(e1&&e1.message?e1.message:e1)+
                  (navigator.onLine===false?" ("+L("offline")+")":"");
          renderAll();
        });
    });
}

/* Plot text is sized from the viewport, so a rotation or a resized window
   has to redraw or the labels keep the old scale. Debounced, and only when
   the width actually changed — iOS fires resize when the URL bar hides. */
var RSZW=(typeof window!=="undefined"&&window.innerWidth)||0, RSZT=null;
if(typeof window!=="undefined") window.addEventListener("resize",function(){
  if(window.innerWidth===RSZW) return;
  RSZW=window.innerWidth;
  clearTimeout(RSZT); RSZT=setTimeout(renderAll,250);
});

document.getElementById("footBox").addEventListener("toggle",function(){
  FOOTOPEN=this.open;
  try{ localStorage.setItem("twatch.foot",FOOTOPEN?"1":"0"); }catch(e){}
});

document.getElementById("langBtn").addEventListener("click",function(){
  lang = LANGS[(LANGS.indexOf(lang)+1)%LANGS.length];
  try{ localStorage.setItem(LS,lang); }catch(e){}
  renderAll();
});
document.getElementById("updBtn").addEventListener("click",function(){
  if(dataAge()<CYCLE_MIN){ renderAll(); return; }   // disabled anyway; belt and braces
  load(true);
});

/* Once the publish window passes, fetch on our own so the page is current
   without anyone tapping anything. Cheap: it is one file on the same origin,
   and load() self-guards inside the 2.5 h window. */
setInterval(function(){
  if(!document.hidden && dataAge()>=CYCLE_MIN) load(true);
  else refreshStatus();
}, 60000);
document.getElementById("refSel").addEventListener("change",function(e){
  try{ localStorage.setItem(LSR,e.target.value); }catch(err){}
  renderAll();
});
try{ var sv=localStorage.getItem(LS); if(LANGS.indexOf(sv)>-1) lang=sv; }catch(e){}
renderAll(); load(true);   // first paint always fetches

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("./sw.js").then(function(reg){
    var last=0;
    function poke(){ var n=Date.now(); if(n-last>6e4){ last=n; reg.update(); } }
    document.addEventListener("visibilitychange",function(){ if(!document.hidden) poke(); });
    window.addEventListener("online",function(){ poke(); load(); });
    reg.addEventListener("updatefound",function(){
      var w=reg.installing; if(!w) return;
      w.addEventListener("statechange",function(){
        if(w.state==="installed" && navigator.serviceWorker.controller){
          UPDREADY=true; renderStamp();      // idempotent, and follows the language
        }
      });
    });
  }).catch(function(){});
}
renderStamp();
</script>
</body>
</html>
