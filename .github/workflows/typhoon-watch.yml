name: Typhoon watch

# JMA reissues typhoon bulletins every 3 hours (more often when a storm
# nears Japan), so a 3-hourly check matches the publication rhythm.
# GitHub's scheduler can be 5-20 min late under load; that is fine here,
# because the app judges freshness from the bulletin's own DTG, not from
# when this workflow ran.
on:
  schedule:
    - cron: "45 */3 * * *"
  workflow_dispatch:        # manual "run now" button in the Actions tab
    inputs:
      probe:
        description: "Connection probe only (no commit)"
        type: boolean
        default: false
  push:
    paths:
      - "scripts/fetch_typhoon.py"
      - "scripts/squall.js"
      - ".github/workflows/typhoon-watch.yml"

permissions:
  contents: write

concurrency:
  group: typhoon-watch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # a shallow clone cannot rebase onto origin

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # scripts/squall.js runs the Sumatra Squall app's own scoring engine
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # A copy of the live SumatraSquall page for the self-test, so the squall
      # bridge is tested against the engine it will actually run. If that site
      # is down, the self-test skips the squall part (and says so) instead of
      # stopping the typhoon data from updating.
      - name: Get SumatraSquall page for self-test
        if: ${{ !inputs.probe }}
        continue-on-error: true
        run: curl -fsS --max-time 60 -o "$RUNNER_TEMP/ssw.html" https://stanleywoosweeleong.github.io/SumatraSquall/index.html

      - name: Connection probe
        if: inputs.probe
        run: python scripts/fetch_typhoon.py --probe

      - name: Parser self-test
        if: ${{ !inputs.probe }}
        run: python scripts/fetch_typhoon.py --selftest

      # Separate and non-blocking: a change in the SumatraSquall app must never
      # stop the typhoon data from updating. A real squall failure still shows
      # on the page, because the fetch below records it in `errors`.
      - name: Squall bridge self-test
        if: ${{ !inputs.probe }}
        continue-on-error: true
        env:
          SQUALL_HTML: ${{ runner.temp }}/ssw.html
        run: python scripts/fetch_typhoon.py --selftest-squall

      - name: Fetch JMA typhoon data
        if: ${{ !inputs.probe }}
        run: python scripts/fetch_typhoon.py

      - name: Commit if changed
        if: ${{ !inputs.probe }}
        run: |
          set -e
          BRANCH="${GITHUB_REF_NAME}"
          git config user.name  "typhoon-watch"
          git config user.email "actions@users.noreply.github.com"

          if git diff --quiet -- data; then
            echo "no change"
            exit 0
          fi

          # Two writers share this branch: this job writes data/, Stanley
          # pushes app files by hand. A plain push loses that race and the run
          # fails with "! [rejected] ... (fetch first)". So: keep the freshly
          # fetched data aside, take whatever the remote has now, put the data
          # back on top, then commit. The newest fetch always wins for data/,
          # and hand-pushed app files are never clobbered.
          TMP="$(mktemp -d)"
          cp -r data "$TMP/"

          for i in 1 2 3; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            rm -rf data
            cp -r "$TMP/data" data
            git add data
            if git diff --cached --quiet; then
              echo "no change after syncing with remote"
              exit 0
            fi
            git commit -m "JMA typhoon data $(date -u +'%Y-%m-%d %H:%MZ')"
            if git push origin "HEAD:$BRANCH"; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push rejected, retrying in 10s"
            sleep 10
          done
          echo "could not push after 3 attempts" >&2
          exit 1
