name: JTWC watch

# JTWC issues warnings at 00/06/12/18Z, usually posted within ~40 min.
# We check every 3 hours so intermediate warnings and ABPW updates land too.
# GitHub's scheduler can be 5-20 min late under load; that is fine here,
# because the app judges freshness from the bulletin's own DTG, not from
# when this workflow ran.
on:
  schedule:
    - cron: "45 */3 * * *"
  workflow_dispatch:        # manual "run now" button in the Actions tab
    inputs:
      probe:
        description: "Connection probe only (no commit)"
        type: boolean
        default: false
  push:
    paths:
      - "scripts/fetch_jtwc.py"
      - ".github/workflows/jtwc-watch.yml"

permissions:
  contents: write

concurrency:
  group: jtwc-watch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Connection probe
        if: inputs.probe
        run: python scripts/fetch_jtwc.py --probe

      - name: Parser self-test
        if: ${{ !inputs.probe }}
        run: python scripts/fetch_jtwc.py --selftest

      - name: Fetch JTWC products
        if: ${{ !inputs.probe }}
        run: python scripts/fetch_jtwc.py

      - name: Commit if changed
        if: ${{ !inputs.probe }}
        run: |
          git config user.name  "jtwc-watch"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "JTWC data $(date -u +'%Y-%m-%d %H:%MZ')"
            git push
          fi
